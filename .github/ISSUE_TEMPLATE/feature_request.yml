name: Feature request
description: Something tagwerk should be able to do and cannot
title: "Idea: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        The best requests start with the problem, not the solution. A described problem can be
        solved in a way nobody had thought of yet; a described solution can only be built or
        refused.

        **This tracker is public** — anything you write stays readable and searchable. And
        anything filed here may end up in the app without further arrangement; there is no
        payment and no claim attached to an idea.

        Answer in German if that is easier.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched the open and closed issues and this is not one of them.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does the app stop you?
      placeholder: >
        I keep a running list of things to ask my doctor. It has no date, so it does not
        belong in a day note, and every morning I copy it forward by hand.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: The workaround. It usually says more about the shape of the fix than the request does.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. If you already have a shape for it, describe it — including how it would look in the note.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Note syntax / file format
        - Editor
        - Task list, filters, horizons
        - Recurrence and carry-forward
        - Sync (WebDAV)
        - History
        - Android home-screen widget
        - Settings
        - Website or documentation
        - Something else / not sure
    validations:
      required: true

  - type: checkboxes
    id: format
    attributes:
      label: The format
      description: >
        tagwerk keeps one markdown file per day and the file is the truth — every feature has
        to survive being read in a plain text editor. The specification is at
        https://caliora.org/tagwerk/format.html
      options:
        - label: My idea needs new syntax in the note.
          required: false
        - label: My idea works with the format as it stands.
          required: false

  - type: dropdown
    id: platform
    attributes:
      label: Where you use tagwerk
      multiple: true
      options:
        - Android
        - Windows
        - Linux
        - Only tried the web demo so far
    validations:
      required: true
