# Contact links shown next to the two forms on the "New issue" page.
# Blank issues stay enabled while Discussions are off: the two forms cover bugs and requests,
# and a question that is neither would otherwise have nowhere to go. Turn this to false once
# Discussions exist and can take them — the forms are the better front door for everything else.
blank_issues_enabled: true
contact_links:
  - name: The file format, in full
    url: https://caliora.org/tagwerk/format.html
    about: What a note may contain and what the parser guarantees. Worth a look before filing a syntax bug.
  - name: Security or privacy problem
    url: https://github.com/caliora-org/tagwerk/security/advisories/new
    about: Report privately here, not as a public issue.
  - name: tagwerk
    url: https://caliora.org/tagwerk/
    about: The product page, the beta, and what the app does today.
